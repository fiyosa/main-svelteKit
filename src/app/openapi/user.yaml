/ping:
  get:
    summary: Ping Server
    description: Mendapatkan status server dan contoh hash ID.
    responses:
      200:
        description: Berhasil
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  example: pong
                data:
                  type: object
                  properties:
                    id:
                      type: number
                      example: 12345
                    hash:
                      type: string
                      example: DogerlGAKAxm

/hash/{data_id}:
  get:
    summary: Decode Hash
    description: Mendecode hash ID menggunakan HashMiddleware.
    parameters:
      - in: path
        name: data_id
        required: true
        schema:
          type: string
          minLength: 1
          example: "DogerlGAKAxm"
    responses:
      200:
        description: Berhasil
