paths:
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login user
      parameters:
        - in: header
          name: X-Forwarded-For
          schema:
            type: string
          description: Client IP Address (automatically detected)
        - in: header
          name: User-Agent
          schema:
            type: string
          description: Client Browser/Platform info (automatically detected)
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: user1
                password:
                  type: string
                  example: password123
              required:
                - username
                - password
      responses:
        '200':
          description: Login successful
        '400':
          description: Validation error or invalid credentials
