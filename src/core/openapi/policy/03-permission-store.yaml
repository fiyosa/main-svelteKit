paths:
  /policy/permission:
    post:
      tags:
        - Policy
      summary: Create permission
      description: Menambahkan permission baru.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: create-user
                notes:
                  type: string
                  example: Can create new users
              required:
                - name
      responses:
        '200':
          description: Permission saved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Permission saved successfully
        '400':
          description: Validation error or duplicate name
