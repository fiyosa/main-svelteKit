paths:
  /policy/permission/{id}:
    delete:
      tags:
        - Policy
      summary: Delete permission
      description: Menghapus permission (soft delete).
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: Permission ID (hash)
      responses:
        '200':
          description: Permission deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Permission deleted successfully
        '404':
          description: Permission not found
